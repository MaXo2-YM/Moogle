name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2.7: the server's Ruby. 3.4: where the Ruby and discordrb upgrade will go.
        ruby: ['2.7', '3.4']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: none # the tests don't need discordrb
      - run: rake test
