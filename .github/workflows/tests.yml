name: Tests

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # every Monday: catches a new Ruby or runner image breaking the tests without any commit

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.4: the server's Ruby (.ruby-version). 4.0: the next one.
        ruby: ['3.4', '4.0']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true # Nokogiri for the Wiktionary pages
      - run: bundle exec rake test
